[workspace]

[package]
name = "razkyn-magicsvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Run with `cargo +stable test` (MagicSVM needs a newer Rust than the 1.89 program toolchain;
# skill local-development.md). scripts/test-magicsvm.sh builds the program first.
[dev-dependencies]
anchor-lang = "=1.0.2"
razkyn = { path = "../../programs/razkyn", features = ["no-entrypoint"] }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "access-control", "vrf"] }
magicsvm = "=0.3.0"
solana-address = "~2.6.1"
solana-clock = "3"
solana-hash = "~4.5.0"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-native-token = "3.0.0"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-transaction = { version = "4.1.5", features = ["verify"] }
solana-transaction-error = "3"
