[package]
name = "razkyn-spike"
version = "0.1.0"
description = "RAZKYN M0 devnet spikes (S1-S6). Throwaway; not the game program."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "razkyn_spike"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "access-control", "vrf", "crank"] }
pyth-solana-receiver-sdk = "=2.0.0"
