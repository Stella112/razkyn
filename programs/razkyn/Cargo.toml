[package]
name = "razkyn"
version = "0.1.0"
description = "RAZKYN — a market-driven multiplayer extraction game on Solana."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "razkyn"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2", features = ["token", "token_2022", "associated_token"] }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "access-control", "vrf", "crank"] }
# SHA-256 syscall wrapper (solana_program::hash is gone in the 3.x crates); sha2 = host builds/tests.
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
# PriceUpdateV2 decode for Live mode (skill pricing-oracle.md; same pin as the M0/S3 spike).
pyth-solana-receiver-sdk = "=2.0.0"
# Pod for [u32; 900] in the zero-copy RaidSecret.
bytemuck = { version = "1.25", features = ["min_const_generics"] }
